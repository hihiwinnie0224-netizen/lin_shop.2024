<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>文案生成器 ⋆⋅☆⋅⋆ 商品上架小幫手</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;500;600;700&family=Noto+Sans+TC:wght@300;400;500;600&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FAF6F2;
    --surface:#FFFFFF;
    --surface-soft:#F4ECE5;
    --text:#3A2E2C;
    --text-soft:#96837D;
    --accent:#C99A93;
    --accent-deep:#A97D74;
    --accent-line:#E6D6CE;
    --shadow: 0 8px 30px rgba(154,120,110,0.08);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Noto Sans TC', sans-serif;
    font-weight:300;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{
    max-width:1180px;
    margin:0 auto;
    padding:48px 28px 80px;
  }
  header{
    text-align:center;
    margin-bottom:44px;
  }
  .eyebrow{
    font-family:'Cormorant Garamond', serif;
    letter-spacing:0.35em;
    font-size:12px;
    color:var(--accent-deep);
    text-transform:uppercase;
    margin-bottom:10px;
  }
  h1{
    font-family:'Noto Serif TC', serif;
    font-weight:600;
    font-size:30px;
    margin:0 0 12px;
    letter-spacing:0.02em;
  }
  .divider{
    color:var(--accent);
    font-family:'Cormorant Garamond', serif;
    font-size:15px;
    letter-spacing:0.25em;
    opacity:0.85;
  }
  .sub{
    color:var(--text-soft);
    font-size:13px;
    margin-top:14px;
    letter-spacing:0.03em;
  }

  .grid{
    display:grid;
    grid-template-columns: 1fr 1.15fr;
    gap:28px;
    align-items:start;
  }
  @media (max-width: 880px){
    .grid{grid-template-columns:1fr;}
  }

  .panel{
    background:var(--surface);
    border-radius:18px;
    box-shadow:var(--shadow);
    padding:28px 26px;
    border:1px solid var(--accent-line);
  }
  .panel-title{
    font-family:'Noto Serif TC', serif;
    font-size:16px;
    font-weight:600;
    margin:0 0 4px;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .panel-title .mark{ color:var(--accent); font-size:13px; }
  .panel-desc{
    font-size:12.5px;
    color:var(--text-soft);
    margin-bottom:18px;
    line-height:1.7;
  }

  label{
    display:block;
    font-size:12px;
    color:var(--text-soft);
    margin:16px 0 6px;
    letter-spacing:0.04em;
  }
  label:first-of-type{ margin-top:0; }

  textarea{
    width:100%;
    min-height:260px;
    resize:vertical;
    border:1px solid var(--accent-line);
    border-radius:12px;
    padding:14px 16px;
    font-family:'Noto Sans TC', sans-serif;
    font-size:13.5px;
    line-height:1.75;
    color:var(--text);
    background:#FCFAF8;
    outline:none;
    transition:border-color .2s ease;
  }
  textarea:focus{ border-color:var(--accent); }

  select{
    width:100%;
    padding:11px 14px;
    border-radius:12px;
    border:1px solid var(--accent-line);
    background:#FCFAF8 url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%23A97D74' stroke-width='2'><polyline points='6 9 12 15 18 9'/></svg>") no-repeat right 14px center;
    background-size:14px;
    appearance:none;
    -webkit-appearance:none;
    font-family:'Noto Sans TC', sans-serif;
    font-size:13.5px;
    color:var(--text);
    cursor:pointer;
  }

  .row2{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }

  .btn{
    margin-top:22px;
    width:100%;
    padding:14px 20px;
    border:none;
    border-radius:999px;
    background:linear-gradient(135deg, var(--accent), var(--accent-deep));
    color:#fff;
    font-family:'Noto Serif TC', serif;
    font-size:14.5px;
    letter-spacing:0.12em;
    cursor:pointer;
    box-shadow:0 10px 24px rgba(169,125,116,0.28);
    transition:transform .15s ease, box-shadow .15s ease, opacity .15s ease;
  }
  .btn:hover{ transform:translateY(-1px); box-shadow:0 14px 28px rgba(169,125,116,0.34); }
  .btn:disabled{ opacity:0.55; cursor:not-allowed; transform:none; }

  .btn-ghost{
    background:transparent;
    border:1px solid var(--accent-line);
    color:var(--accent-deep);
    box-shadow:none;
    font-family:'Noto Sans TC', sans-serif;
    letter-spacing:0.04em;
    padding:9px 16px;
    font-size:12.5px;
  }
  .btn-ghost:hover{ background:var(--surface-soft); box-shadow:none; }

  .error{
    margin-top:14px;
    font-size:12.5px;
    color:#B85C5C;
    background:#FBEDEC;
    border:1px solid #F0D3D1;
    padding:10px 14px;
    border-radius:10px;
    line-height:1.6;
  }

  /* output */
  .empty-state{
    text-align:center;
    padding:70px 20px;
    color:var(--text-soft);
  }
  .empty-state .glyph{
    font-family:'Cormorant Garamond', serif;
    font-size:22px;
    letter-spacing:0.3em;
    color:var(--accent);
    margin-bottom:14px;
  }
  .empty-state p{ font-size:13px; line-height:1.9; }

  .loading{
    text-align:center;
    padding:70px 20px;
  }
  .loading .glyph{
    font-family:'Cormorant Garamond', serif;
    font-size:20px;
    letter-spacing:0.3em;
    color:var(--accent);
    animation:breathe 1.6s ease-in-out infinite;
  }
  @keyframes breathe{
    0%,100%{ opacity:0.35; letter-spacing:0.3em; }
    50%{ opacity:1; letter-spacing:0.45em; }
  }
  .loading p{ margin-top:14px; font-size:12.5px; color:var(--text-soft); }

  .field{
    border-top:1px solid var(--accent-line);
    padding:20px 0;
  }
  .field:first-child{ border-top:none; padding-top:4px; }

  .field-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:10px;
  }
  .field-label{
    font-family:'Noto Serif TC', serif;
    font-size:13px;
    font-weight:600;
    color:var(--accent-deep);
    letter-spacing:0.04em;
    display:flex;
    align-items:center;
    gap:6px;
  }
  .field-label .n{ font-family:'Cormorant Garamond', serif; font-style:italic; color:var(--accent); font-size:13px; }

  .copy-btn{
    border:none;
    background:var(--surface-soft);
    color:var(--accent-deep);
    font-size:11px;
    padding:5px 12px;
    border-radius:999px;
    cursor:pointer;
    letter-spacing:0.04em;
    transition:background .15s ease;
  }
  .copy-btn:hover{ background:var(--accent-line); }
  .copy-btn.copied{ background:var(--accent); color:#fff; }

  .field-value{
    font-size:13px;
    line-height:1.85;
    white-space:pre-wrap;
    color:var(--text);
  }
  .field-value.mono{
    font-family:'Noto Sans TC', sans-serif;
    background:#FCFAF8;
    border:1px solid var(--accent-line);
    border-radius:10px;
    padding:16px 18px;
  }

  .output-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:6px;
    flex-wrap:wrap;
    gap:10px;
  }

  footer{
    text-align:center;
    margin-top:52px;
    color:var(--text-soft);
    font-size:11.5px;
    letter-spacing:0.06em;
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="eyebrow">Product Copy Studio</div>
    <h1>商品文案生成器</h1>
    <div class="divider">⋆⋅☆⋅⋆</div>
    <div class="sub">貼上一大串商品資訊，自動整理成上架欄位與質感文案</div>
  </header>

  <div class="grid">

    <!-- LEFT: input -->
    <section class="panel">
      <p class="panel-title"><span class="mark">˚｡⋆</span> 原始資料</p>
      <p class="panel-desc">把商品的所有資訊（名稱、特色、材質、尺寸、收單資訊⋯）整段貼上即可，不需要先整理格式。</p>

      <label>貼上商品原始文字</label>
      <textarea id="rawInput" placeholder="例如：QUNCLE 海綿寶寶矽膠眼鏡盒，正版授權，矽膠材質，可收納眼鏡/AirPods/充電線，附提繩，尺寸16.2×4.4×8.6cm，8/6收單⋯"></textarea>

      <div class="row2">
        <div>
          <label>文案風格</label>
          <select id="styleSelect">
            <option value="minimal">網美／韓系質感線條 · Minimalist &amp; Delicate</option>
            <option value="coquette">蝴蝶結復古少女感 · Coquette &amp; Ribbon</option>
            <option value="sparkle">閃耀魔法夢幻氛圍 · Sparkles &amp; Dreamy</option>
            <option value="botanical">復古手作花草氛圍 · Vintage &amp; Botanical</option>
            <option value="simple">簡約分隔線 · Clean Divider Lines</option>
          </select>
        </div>
        <div>
          <label>語氣強度</label>
          <select id="toneSelect">
            <option value="soft">柔和內斂</option>
            <option value="normal" selected>自然日常（如範例）</option>
            <option value="excited">熱情有感染力</option>
          </select>
        </div>
      </div>

      <button class="btn" id="generateBtn">⋆ 生成商品文案 ⋆</button>
      <div id="errorBox"></div>
    </section>

    <!-- RIGHT: output -->
    <section class="panel">
      <div class="output-top">
        <p class="panel-title" style="margin-bottom:0;"><span class="mark">✧</span> 產出欄位</p>
        <button class="btn-ghost" id="copyAllBtn" style="display:none;">複製整份文案</button>
      </div>
      <div id="outputArea">
        <div class="empty-state">
          <div class="glyph">⋆ ｡ﾟ☆</div>
          <p>貼上資料並按下生成後<br>結果會顯示在這裡</p>
        </div>
      </div>
    </section>

  </div>

  <footer>QUNCLE STUDIO ⋆⋅☆⋅⋆ Copy Generator</footer>
</div>

<script>
const STYLE_LIBRARY = {
  minimal: {
    label: "網美/韓系質感線條與點綴 (Minimalist & Delicate)",
    dividers: ["─── ⋆⋅☆⋅⋆ ───", "─── ･ ｡ﾟ☆: .☽ . :☆ﾟ. ───", "✧──── ꒰ ♡ ꒱ ────✧", "┈─➤", "─── ⋆ ˚｡⋆୨୧˚", "─── ⋆⋅☆⋅⋆ ───", "─── ౨ৎ ───"]
  },
  coquette: {
    label: "蝴蝶結與復古少女感 (Coquette & Ribbon)",
    dividers: ["୨୧┈┈┈┈┈┈┈┈┈┈┈┈┈┈┈┈┈┈୨୧", "˚₊‧꒰ 𐦍 ꒱‧₊˚", "୨୧ ⊹ ˚.", "┈┈┈ ୨୧ ┈┈┈", "♡ ─── ୨୧ ─── ♡", "‧₊˚ ☁️⋅♡ 𓂃 ୨୧", "─── 𐦍 ───"]
  },
  sparkle: {
    label: "閃耀魔法與夢幻氛圍 (Sparkles & Dreamy)",
    dividers: ["✧｡٩(ˊᗜˋ)و✧｡", "✦•┈••✦ ✦••┈•✦", "˚ ༘♡ ⋆｡˚ ❀", "⋆⁺₊⋆ ☾ ⋆⁺₊⋆", "✧˖°.", "✦ ˚ ✦ ˚ ✦", "✦˚₊‧✩‧₊˚✦"]
  },
  botanical: {
    label: "復古手作與花草氛圍 (Vintage & Botanical)",
    dividers: ["❀ ─── ❀ ─── ❀", "✿.｡.:* ☆::.", "─── 𖤣𖥧𖥣｡ ───", "𖧷 ┈ 𖧷 ┈ 𖧷", "✦•┈┈┈┈┈┈┈┈┈•✦", "─── 𓆸 ───", "✾ ────── ✾"]
  },
  simple: {
    label: "簡約分隔線 (Divider Lines)",
    dividers: ["─── ⋆⋅☆⋅⋆ ───", "┈─┈─┈─┈─┈─┈─┈", "✧────────────────✧", "•┈┈┈┈┈┈┈┈┈┈┈┈┈┈┈┈•", "⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯", "─── ⋆ ˚｡⋆୨୧˚ ───", "═───═───═───═"]
  }
};

const BRACKETS = ["﹝ ﹞", "【 】", "⟦ ⟧", "₍ ₎", "꒰ ꒱", "❮ ❯", "⌈ ⌋", "≪ ≫", "⟨ ⟩", "｢ ｣"];

const TONE_LABEL = {
  soft: "柔和內斂、少驚嘆號、語句簡短",
  normal: "自然日常、口語親切",
  excited: "熱情有感染力、多用語助詞與驚嘆號、像在跟閨蜜安利"
};

function generatePrompt(){
  const raw = document.getElementById('rawInput').value.trim();
  const errorBox = document.getElementById('errorBox');
  const outputArea = document.getElementById('outputArea');
  const copyAllBtn = document.getElementById('copyAllBtn');
  errorBox.innerHTML = '';

  if(!raw){
    errorBox.innerHTML = '<div class="error">請先貼上商品原始資料再生成。</div>';
    return;
  }

  const styleKey = document.getElementById('styleSelect').value;
  const toneKey = document.getElementById('toneSelect').value;
  const style = STYLE_LIBRARY[styleKey];

  const fullPrompt = `你是一位電商平台的商品文案編輯，請幫我把以下的【商品原始資料】整理成上架欄位與文案。

【文案風格要求】
- 風格：${style.label}
- 語氣：${TONE_LABEL[toneKey]}

【裝飾符號參考（請挑選 2-3 種搭配使用）】
- 分隔線：${style.dividers.join(" / ")}
- 括號：${BRACKETS.join(" / ")}

【請依序輸出以下 8 個欄位】
1. 商品名稱：開頭加上裝飾括號（例如【正版授權】品牌 商品名稱｜賣點）
2. 商品分類：格式如「⋆ 分類一 ／ 分類二 ⋆」
3. 商品 SEO-Title：30字內純文字
4. 商品 SEO-Description：45-60字以內純文字
5. 商品摘要：4-6條重點，每條獨立一行，開頭用「˚｡⋆」
6. 商品描述（純文字版）：包含標題、開場文案、商品亮點、商品資訊（規格條列）、注意事項（外盒物流壓痕警語）
7. 是否為預購商品：填 Y 或 N
8. 商品預購提示：如【 X/X 收單 】交期預計4-6週（非預購則留空）

【商品原始資料】
${raw}`;

  // 渲染至右側畫面
  outputArea.innerHTML = `
    <div class="field">
      <div class="field-head">
        <span class="field-label">✨ 已生成 AI 提示詞（請複製後貼給 ChatGPT / Claude）</span>
        <button class="copy-btn" id="copyPromptBtn">複製提示詞</button>
      </div>
      <div class="field-value mono" style="white-space: pre-wrap;">${esc(fullPrompt)}</div>
    </div>`;

  copyAllBtn.style.display = 'none';

  document.getElementById('copyPromptBtn').addEventListener('click', async () => {
    const ok = await copyText(fullPrompt);
    const btn = document.getElementById('copyPromptBtn');
    btn.textContent = ok ? '已複製！請貼給 AI' : '複製失敗';
    btn.classList.toggle('copied', ok);
    setTimeout(() => { btn.textContent = '複製提示詞'; btn.classList.remove('copied'); }, 2000);
  });
}

function esc(s){
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

async function copyText(text){
  if(navigator.clipboard && navigator.clipboard.writeText && window.isSecureContext){
    try { await navigator.clipboard.writeText(text); return true; } catch(e){}
  }
  try{
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed'; ta.style.top = '-1000px';
    document.body.appendChild(ta);
    ta.select();
    const success = document.execCommand('copy');
    document.body.removeChild(ta);
    return success;
  }catch(e){ return false; }
}

document.getElementById('generateBtn').addEventListener('click', generatePrompt);
</script>
</body>
</html>
