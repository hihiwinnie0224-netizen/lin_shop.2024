<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Lin Shop 優惠券核銷</title>
  <!-- LINE LIFF SDK -->
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    body { background-color: #f5f5f7; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
    .card { background: #ffffff; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); width: 100%; max-width: 380px; padding: 24px; text-align: center; }
    .badge { background: #e8f5e9; color: #2e7d32; font-size: 13px; font-weight: bold; padding: 4px 12px; border-radius: 12px; display: inline-block; margin-bottom: 12px; }
    h2 { font-size: 20px; color: #333; margin-bottom: 8px; }
    p.desc { font-size: 14px; color: #666; margin-bottom: 20px; line-height: 1.5; }
    
    .warning-box { background: #fff3e0; border: 1px solid #ffe0b2; color: #e65100; padding: 12px; border-radius: 8px; font-size: 13px; margin-bottom: 20px; }
    .btn-main { width: 100%; background: #06C755; color: white; border: none; padding: 14px; font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer; }
    .btn-main:disabled { background: #ccc; cursor: not-allowed; }
    
    /* Modal 彈窗 */
    .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); justify-content: center; align-items: flex-end; z-index: 1000; }
    .modal-content { background: white; width: 100%; max-width: 480px; border-radius: 20px 20px 0 0; padding: 24px; text-align: center; animation: slideUp 0.3s ease-out; }
    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    
    /* PIN 碼顯示圈圈 */
    .pin-display { display: flex; justify-content: center; gap: 12px; margin: 20px 0; }
    .pin-dot { width: 16px; height: 16px; border-radius: 50%; border: 2px solid #ccc; }
    .pin-dot.active { background: #06C755; border-color: #06C755; }
    
    /* 數字鍵盤 */
    .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 10px; }
    .key { background: #f0f0f0; border: none; padding: 16px; font-size: 20px; font-weight: bold; border-radius: 12px; cursor: pointer; color: #333; }
    .key:active { background: #e0e0e0; }
    
    .error-msg { color: #d32f2f; font-size: 13px; height: 18px; margin-top: 8px; }
    .success-icon { font-size: 48px; color: #06C755; margin-bottom: 12px; }
  </style>
</head>
<body>

  <div class="card" id="couponCard">
    <span class="badge">LIN SHOP 專屬優惠</span>
    <h2>全館商品 9 折優惠券</h2>
    <p class="desc" id="statusDesc">連線檢查中，請稍候...</p>
    
    <div class="warning-box">
      ⚠️ 警語：請勿自行核銷，若誤按導致優惠券無效，恕不補發。
    </div>
    
    <button class="btn-main" id="useBtn" onclick="openKeypad()" disabled>載入中...</button>
  </div>

  <!-- 數字鍵盤彈窗 -->
  <div class="modal-overlay" id="keypadModal">
    <div class="modal-content">
      <h3>店員身份核銷</h3>
      <p style="font-size: 13px; color: #888; margin-top: 4px;">請店員輸入門市專用 4 位數 PIN 碼</p>
      
      <div class="pin-display">
        <div class="pin-dot" id="dot-0"></div>
        <div class="pin-dot" id="dot-1"></div>
        <div class="pin-dot" id="dot-2"></div>
        <div class="pin-dot" id="dot-3"></div>
      </div>

      <div class="error-msg" id="errorMsg"></div>

      <div class="keypad">
        <button class="key" onclick="pressKey('1')">1</button>
        <button class="key" onclick="pressKey('2')">2</button>
        <button class="key" onclick="pressKey('3')">3</button>
        <button class="key" onclick="pressKey('4')">4</button>
        <button class="key" onclick="pressKey('5')">5</button>
        <button class="key" onclick="pressKey('6')">6</button>
        <button class="key" onclick="pressKey('7')">7</button>
        <button class="key" onclick="pressKey('8')">8</button>
        <button class="key" onclick="pressKey('9')">9</button>
        <button class="key" onclick="closeKeypad()" style="font-size:14px; background:#fff; border:1px solid #ccc;">取消</button>
        <button class="key" onclick="pressKey('0')">0</button>
        <button class="key" onclick="deleteKey()" style="font-size:14px;">⌫</button>
      </div>
    </div>
  </div>

  <script>
    // 門市專用 4 位數密碼（可自行修改）
    const STORE_PIN = "8888"; 
    
    // 已自動填入你的 Google Apps Script Web App 網址
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbxPwwNdKRm2jtaxv9m_sOpWQ8-KZAdoHR1CLuiVtSFvNTAieKiYZSjHobaTCCIagG7s/exec"; 
    
    let inputPin = "";

    window.onload = function() {
      // LIFF 初始化
      liff.init({ liffId: "2011481122-w9TOizic" })
        .then(() => {
          checkStatus();
        })
        .catch((err) => {
          console.error("LIFF Init Error", err);
          checkStatus(); // LIFF 載入失敗時仍進行狀態檢查
        });
    };

    function checkStatus() {
      // 1. 檢查手機本地端是否已兌換過
      if (localStorage.getItem("lin_shop_coupon_used") === "true") {
        showAlreadyUsedScreen();
        return;
      }

      // 2. 向 Google 試算表查詢總發放量是否還有額度
      fetch(`${GAS_API_URL}?action=check`)
        .then(res => res.json())
        .then(data => {
          if (data.available) {
            document.getElementById('statusDesc').innerText = "出示此畫面給店員，由店員輸入門市密碼即可完成現場核銷。";
            const btn = document.getElementById('useBtn');
            btn.innerText = "請店員點擊核銷";
            btn.disabled = false;
          } else {
            showSoldOutScreen();
          }
        })
        .catch(err => {
          console.error(err);
          // 若網路延遲，預設先允許開啟輸入框
          document.getElementById('statusDesc').innerText = "出示此畫面給店員，由店員輸入門市密碼即可完成現場核銷。";
          const btn = document.getElementById('useBtn');
          btn.innerText = "請店員點擊核銷";
          btn.disabled = false;
        });
    }

    function openKeypad() {
      inputPin = "";
      updatePinDisplay();
      document.getElementById('errorMsg').innerText = "";
      document.getElementById('keypadModal').style.display = 'flex';
    }

    function closeKeypad() {
      document.getElementById('keypadModal').style.display = 'none';
    }

    function pressKey(num) {
      if (inputPin.length < 4) {
        inputPin += num;
        updatePinDisplay();
      }
      if (inputPin.length === 4) {
        setTimeout(verifyPin, 100);
      }
    }

    function deleteKey() {
      if (inputPin.length > 0) {
        inputPin = inputPin.substring(0, inputPin.length - 1);
        updatePinDisplay();
      }
    }

    function updatePinDisplay() {
      for (let i = 0; i < 4; i++) {
        const dot = document.getElementById(`dot-${i}`);
        if (i < inputPin.length) {
          dot.classList.add('active');
        } else {
          dot.classList.remove('active');
        }
      }
    }

    function verifyPin() {
      if (inputPin === STORE_PIN) {
        closeKeypad();
        
        // 密碼正確，向 Google 試算表發送 +1 紀錄
        fetch(`${GAS_API_URL}?action=use`)
          .then(res => res.json())
          .then(data => {
            if (data.success) {
              localStorage.setItem("lin_shop_coupon_used", "true");
              showSuccessScreen();
            } else {
              showSoldOutScreen();
            }
          })
          .catch(() => {
            // 即便 API 異常也先標記本地已用，確保現場核銷順利
            localStorage.setItem("lin_shop_coupon_used", "true");
            showSuccessScreen();
          });
      } else {
        document.getElementById('errorMsg').innerText = "密碼錯誤，請重新輸入";
        inputPin = "";
        updatePinDisplay();
      }
    }

    function showSuccessScreen() {
      document.getElementById('couponCard').innerHTML = `
        <div class="success-icon">✓</div>
        <h2 style="color:#06C755;">核銷成功</h2>
        <p class="desc" style="margin-top:8px;">本優惠券已完成使用。</p>
        <p style="font-size:12px; color:#999; margin-top:20px;">核銷時間：${new Date().toLocaleString()}</p>
      `;
    }

    function showAlreadyUsedScreen() {
      document.getElementById('couponCard').innerHTML = `
        <div style="font-size:48px; color:#999; margin-bottom:12px;">🚫</div>
        <h2 style="color:#666;">優惠券已使用</h2>
        <p class="desc" style="margin-top:8px;">每一個 LINE 帳號限使用一次，您先前已完成兌換。</p>
      `;
    }

    function showSoldOutScreen() {
      document.getElementById('couponCard').innerHTML = `
        <div style="font-size:48px; color:#999; margin-bottom:12px;">⌛</div>
        <h2 style="color:#666;">優惠券已領完</h2>
        <p class="desc" style="margin-top:8px;">感謝您的支持，本活動優惠券已全數兌換完畢！</p>
      `;
    }
  </script>
</body>
</html>
